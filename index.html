<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daily snowflake</title>
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      height: 100%;
      background-color: #f4f4f4;
    }
    #calendar {
      width: 100%;
    }
    #time {
      margin-top: 20px;
      font-size: 64px;
      color: red;
      font-weight: bold;
      text-align: center;
    }
    @media (max-width: 768px) {
      #time {
        font-size: 36px;
      }
    }
    @media (max-width: 480px) {
      #time {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="calendar"></div>
  <div id="time"></div>

  <script>
    function createMonthSVG(month, daysInMonth, startDay) {
      const xmlns = "http://www.w3.org/2000/svg";
      const baseWidth = 400; // Vergrößerte Breite für bessere mobile Darstellung
      const baseHeight = 400; // Vergrößerte Höhe für bessere mobile Darstellung

      const svg = document.createElementNS(xmlns, "svg");
      svg.setAttribute("xmlns", xmlns);
      svg.setAttribute("viewBox", `0 0 ${baseWidth} ${baseHeight}`);
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "auto");

      // Hintergrundtext für den Monat
      const monthText = document.createElementNS(xmlns, "text");
      monthText.setAttribute("x", baseWidth / 2);
      monthText.setAttribute("y", baseHeight / 2);
      monthText.setAttribute("text-anchor", "middle");
      monthText.setAttribute("dominant-baseline", "middle");
      monthText.setAttribute("font-size", "86");
      monthText.setAttribute("fill", "rgb(255, 0, 0)");
      monthText.setAttribute(
        "transform",
        `rotate(-90 ${baseWidth / 2},${baseHeight / 2})`
      );
      monthText.setAttribute("font-family", "Helvetica");
      monthText.textContent = month;
      svg.appendChild(monthText);

      // Wochentage
      const weekdays = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
      const spiralRadius = 30;
      const spacing = 24;
      const angleStep = (2 * Math.PI) / 7;
      const today = new Date();

      let dayOfWeek = startDay;
      const positions = {}; // Speichert die Positionen für jeden Wochentag

      for (let i = 1; i <= daysInMonth; i++) {
        const angle = i * angleStep;
        const radius = spiralRadius + (i * spacing) / 7;

        const x = baseWidth / 2 + radius * Math.cos(angle);
        const y = baseHeight / 2 + radius * Math.sin(angle);

        // Zahl hinzufügen
        const dayTextElement = document.createElementNS(xmlns, "text");
        dayTextElement.setAttribute("x", x);
        dayTextElement.setAttribute("y", y);
        dayTextElement.setAttribute("text-anchor", "middle");
        dayTextElement.setAttribute("dominant-baseline", "middle");
        dayTextElement.setAttribute("font-size", "8");
        dayTextElement.setAttribute("font-family", "Helvetica");
        dayTextElement.setAttribute("font-weight", "bold");
        dayTextElement.textContent = `${String(i).padStart(2, "0")}`;

        // Markiere den aktuellen Tag mit einem roten Kreis
        if (today.getDate() === i) {
          const circle = document.createElementNS(xmlns, "circle");
          circle.setAttribute("cx", x);
          circle.setAttribute("cy", y);
          circle.setAttribute("r", 10);
          circle.setAttribute("fill", "none");
          circle.setAttribute("stroke", "red");
          circle.setAttribute("stroke-width", 2);
          svg.appendChild(circle);
        }

        svg.appendChild(dayTextElement);

        // Speichere die Position für den jeweiligen Wochentag
        positions[dayOfWeek] = { x, y };

        // Wochentag für den nächsten Tag anpassen
        dayOfWeek = (dayOfWeek + 1) % 7;
      }

      // Füge die Wochentage an den jeweiligen Endpositionen hinzu
      weekdays.forEach((weekday, index) => {
        if (positions[index]) {
          const { x, y } = positions[index];
          const weekdayTextElement = document.createElementNS(xmlns, "text");
          weekdayTextElement.setAttribute("x", x);
          weekdayTextElement.setAttribute("y", y - 15);
          weekdayTextElement.setAttribute("text-anchor", "middle");
          weekdayTextElement.setAttribute("dominant-baseline", "middle");
          weekdayTextElement.setAttribute("font-size", "10");
          weekdayTextElement.setAttribute("font-family", "Helvetica");
          weekdayTextElement.setAttribute("font-weight", "bold");
          weekdayTextElement.textContent = weekday;
          svg.appendChild(weekdayTextElement);
        }
      });

      return svg;
    }

    function updateCalendar() {
      const calendarDiv = document.getElementById("calendar");
      calendarDiv.innerHTML = "";

      const now = new Date();
      const year = now.getFullYear();
      const month = now.toLocaleString("de-DE", { month: "long" });
      const daysInMonth = new Date(year, now.getMonth() + 1, 0).getDate();
      const startDay = new Date(year, now.getMonth(), 1).getDay();

      const svg = createMonthSVG(
        month.toUpperCase(),
        daysInMonth,
        startDay === 0 ? 6 : startDay - 1
      );

      calendarDiv.appendChild(svg);
    }

    function updateTime() {
      const now = new Date();
      const timeDiv = document.getElementById("time");
      timeDiv.textContent = now.toLocaleTimeString("de-DE");
    }

    updateCalendar();
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
